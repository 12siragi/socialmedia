services:
  # 1. Redis cache
  redis:
    image: redis:latest
    container_name: socialmedia-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - socialmedia-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 2. Postgres database
  postgres:
    image: postgres:15
    container_name: socialmedia-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - socialmedia-network
    restart: unless-stopped

  # 3. Django backend
  socialmedia-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: socialmedia-backend
    command: >
      sh -c "python manage.py migrate --no-input &&
             python manage.py collectstatic --noinput &&
             gunicorn backend.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - .:/app
      - static_volume:/app/static
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    networks:
      - socialmedia-network

  # 4. Celery worker
  celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: socialmedia-celery
    command: celery -A backend worker --loglevel=info --concurrency=2
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    networks:
      - socialmedia-network
    restart: unless-stopped

  # 5. Celery Beat scheduler (optional - for periodic tasks)
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: socialmedia-celery-beat
    command: celery -A backend beat -l info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    networks:
      - socialmedia-network
    restart: unless-stopped

  # 6. NGINX reverse proxy
  nginx:
    image: nginx:latest
    container_name: socialmedia-nginx
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/static:ro
    depends_on:
      - socialmedia-backend
    networks:
      - socialmedia-network

volumes:
  postgres_data:
  static_volume:
  redis_data:

networks:
  socialmedia-network: