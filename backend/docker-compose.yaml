services:
  # 1. Redis
  redis:
    image: redis:latest
    container_name: socialmedia-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - socialmedia-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 2. Postgres
  postgres:
    image: postgres:15
    container_name: socialmedia-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - socialmedia-network
    restart: unless-stopped

  # 3. LibreTranslate (AI Translation - self-hosted, free forever)
  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: socialmedia-libretranslate
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - LT_LOAD_ONLY=en,ar
      - LT_DISABLE_WEB_UI=false
      - LT_UPDATE_MODELS=true
    volumes:
      - libretranslate_data:/home/libretranslate/.local
    networks:
      - socialmedia-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5000/languages || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s   # Give it time to download language models on first run

  # 4. Django (HTTP via gunicorn)
  socialmedia-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: socialmedia-backend
    command: >
      sh -c "python manage.py migrate --no-input &&
             python manage.py collectstatic --noinput &&
             gunicorn backend.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - .:/app
      - static_volume:/app/static
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
      - libretranslate
    networks:
      - socialmedia-network
    restart: unless-stopped

  # 5. Daphne (WebSocket via ASGI)
  daphne:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: socialmedia-daphne
    command: daphne -b 0.0.0.0 -p 8001 backend.asgi:application
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
      - libretranslate
    networks:
      - socialmedia-network
    restart: unless-stopped

  # 6. Celery worker
  celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: socialmedia-celery
    command: celery -A backend worker --loglevel=info --concurrency=2
    volumes:
      - .:/app
      - media_volume:/app/media
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    networks:
      - socialmedia-network
    restart: unless-stopped

  # 7. Celery Beat
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: socialmedia-celery-beat
    command: celery -A backend beat -l info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    networks:
      - socialmedia-network
    restart: unless-stopped

    # 8. Coqui TTS (self-hosted text-to-speech)
  coqui-tts:
    image: ghcr.io/coqui-ai/tts:latest
    container_name: socialmedia-coqui
    entrypoint: python
    command: >
      TTS/server/server.py
      --model_name tts_models/en/ljspeech/tacotron2-DDC
      --port 5002
      --use_cuda false
    ports:
      - "5002:5002"
    volumes:
      - coqui_models:/root/.local/share/tts
    networks:
      - socialmedia-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5002/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # 9. NGINX
  nginx:
    image: nginx:latest
    container_name: socialmedia-nginx
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/static:ro
      - media_volume:/app/media:ro
    depends_on:
      - socialmedia-backend
      - daphne
    networks:
      - socialmedia-network

volumes:
  postgres_data:
  static_volume:
  media_volume:
  redis_data:
  libretranslate_data:    # Persists downloaded language models
  coqui_models:     # Persists downloaded TTS models

networks:
  socialmedia-network: