upstream django {
    server socialmedia-backend:8000;  # match your backend service name
}

server {
    listen 80;

    server_name localhost;

    # Increase upload size limit
    client_max_body_size 10M;

    # Serve static files
    location /static/ {
        alias /app/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ✅ FIXED: Serve media files from correct path
    location /media/ {
        alias /app/media/;  # Changed from /app/uploads/ to /app/media/
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin *;
    }

    # Forward other requests to Django
    location / {
        proxy_pass http://django;   # <-- must match upstream name
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}