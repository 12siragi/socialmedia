upstream django {
    server socialmedia-backend:8000;  # match your backend service name
}

server {
    listen 80;

    server_name localhost;

    # Serve static files
    location /static/ {
        alias /app/static/;
    }

    location /media/ {
        alias /app/uploads/;
    }

    # Forward other requests to Django
    location / {
        proxy_pass http://django;   # <-- must match upstream name
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
